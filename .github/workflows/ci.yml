name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration

  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - signalk: cr.signalk.io/signalk/signalk-server:v2.31.1
            experimental: false
          - signalk: cr.signalk.io/signalk/signalk-server:latest
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    env:
      SIGNALK_SERVER_IMAGE: ${{ matrix.signalk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:acceptance
      - if: always()
        run: docker compose -f docker-compose.acceptance.yml down -v --remove-orphans

  browser-and-restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:restart
