name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Formatting and unit tests run in signalk-ci.yml. The build below
      # also performs strict TypeScript checking and supplies package artifacts.
      - run: npm run test:integration
      - run: npm run build
      - run: npm run package:check
      - run: npm run package:smoke

  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - signalk: cr.signalk.io/signalk/signalk-server:v2.31.1
            experimental: false
          - signalk: cr.signalk.io/signalk/signalk-server:latest
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    env:
      SIGNALK_SERVER_IMAGE: ${{ matrix.signalk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:acceptance
      - if: always()
        run: docker compose -f docker-compose.acceptance.yml down -v --remove-orphans

  browser-and-restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: test-results/
          retention-days: 7
      - run: npm run test:restart

  core-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: hatlabs/signalk-server
          ref: ae7f8684514c96cbca9208a3da3c1e8440840021
          path: .core-server
      # The upstream development branch has no lockfile. Hardware addons are
      # unnecessary: acceptance uses only loopback HTTP and local SQLite.
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: .core-server
      - run: npm run build:all
        working-directory: .core-server
      - uses: actions/checkout@v4
        with:
          repository: hatlabs/signalk-alert-rules
          ref: ae6a2ee2595314ff0f6021e827d87759a0470db5
          path: .alert-rules
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .alert-rules
      - run: npm run build
        working-directory: .alert-rules
      - run: npm run test:core
        env:
          SIGNALK_ALERT_RULES_DIR: ${{ github.workspace }}/.alert-rules
          SIGNALK_CORE_SERVER_DIR: ${{ github.workspace }}/.core-server
