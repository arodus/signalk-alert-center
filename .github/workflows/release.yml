name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.6.0
      - name: Verify release tag and notes
        run: node scripts/verify-release-tag.mjs "$GITHUB_REF_NAME"
      - name: Build and inspect package
        run: |
          npm run build
          npm run package:check
          npm run package:smoke
      - name: Create release package
        id: package
        run: node scripts/create-release-package.mjs
      - name: Extract release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" release-notes.md
      - name: Preserve reviewed package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-npm-package
          path: |
            ${{ steps.package.outputs.package-file }}
            ${{ steps.package.outputs.checksum-file }}
          if-no-files-found: error
      - name: Select npm distribution tag
        id: channel
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        env:
          # Used only to bootstrap a brand-new npm package. Remove this secret
          # after configuring the package trusted publisher; npm then uses OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: npm publish "${{ steps.package.outputs.package-file }}" --access public --tag "${{ steps.channel.outputs.tag }}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_type=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_type=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.package-file }}" \
            "${{ steps.package.outputs.checksum-file }}" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${release_type[@]}"
