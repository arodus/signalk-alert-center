services:
  notifier-mock:
    build: ./test/integration/mock-server
    init: true
    ports:
      - "${NOTIFIER_MOCK_PORT:-18080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 1s
      timeout: 2s
      retries: 20
      start_period: 2s

  signalk:
    build:
      context: .
      dockerfile: Dockerfile
      target: acceptance
      args:
        SIGNALK_SERVER_IMAGE: ${SIGNALK_SERVER_IMAGE:-cr.signalk.io/signalk/signalk-server:v2.31.1}
    init: true
    environment:
      SIGNALK_DISABLE_SECURITY: "1"
      SIGNALK_ZONE_REFRESH_SECONDS: "1"
    ports:
      - "${SIGNALK_ACCEPTANCE_PORT:-3300}:3000"
    volumes:
      - signalk-test-data:/home/node/.signalk
    depends_on:
      notifier-mock:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/signalk').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 10s

  acceptance:
    image: node:22.14.0-alpine3.21
    init: true
    working_dir: /tests
    volumes:
      - ./test/integration/acceptance.mjs:/tests/acceptance.mjs:ro
    command: ["node", "/tests/acceptance.mjs"]
    environment:
      SIGNALK_URL: http://signalk:3000
      NOTIFIER_MOCK_URL: http://notifier-mock:8080
    depends_on:
      signalk:
        condition: service_healthy
      notifier-mock:
        condition: service_healthy

volumes:
  signalk-test-data:
