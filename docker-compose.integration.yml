services:
  notifier-mock:
    build: ./test/integration/mock-server
    init: true
    ports:
      - "${NOTIFIER_MOCK_PORT:-18080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 1s
      timeout: 2s
      retries: 20
      start_period: 2s
    networks:
      - notifier-test

networks:
  notifier-test:
    driver: bridge
