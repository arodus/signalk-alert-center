services:
  signalk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signalk-persistent-notifier
    ports:
      - "3000:3000"
    volumes:
      - signalk-data:/home/node/.signalk
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/signalk').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped

volumes:
  signalk-data:
